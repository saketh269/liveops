name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      LIVEOPS_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      LIVEOPS_TEST_REDIS_URL: redis://localhost:6379/0
      LIVEOPS_TEST_MYSQL_DSN: mysql://root:root@127.0.0.1:3306/
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - name: Enable logical replication (for CDC tests)
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c "echo 'wal_level = logical' >> /var/lib/postgresql/data/postgresql.conf"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -U postgres && break; sleep 1; done
      # MySQL runs as a step, not under `services:`, because service containers can't take
      # a command and CDC tests need the binary log in ROW format.
      - name: Start MySQL 8.0 (binlog on, ROW format)
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root mysql:8.0 \
            --log-bin=mysql-bin --binlog-format=ROW --server-id=1
          for i in $(seq 1 60); do
            docker exec mysql mysql -uroot -proot -h127.0.0.1 -e "SELECT 1" >/dev/null 2>&1 && break; sleep 2
          done
          docker exec mysql mysql -uroot -proot -h127.0.0.1 -e "SELECT @@log_bin, @@binlog_format, @@have_ssl"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy app
      - name: Tests (unit, contract, integration)
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --strict --progress-spinner off || (echo "::warning::pip-audit found issues" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
