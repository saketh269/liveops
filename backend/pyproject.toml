[project]
name = "liveops-backend"
version = "0.1.0"
description = "Live Ops Portal backend: connectors, state store, API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "redis>=5.0",
  "cryptography>=43",
  "websockets>=12",
  "anyio>=4",
  "psycopg2-binary>=2.9.9",
  "PyMySQL>=1.1.1,<1.2",  # 1.2.x breaks caching_sha2 sign-in without TLS
  "mysql-replication>=1.0.9,<1.1",
  "certifi>=2024.2.2",  # CA bundle fallback for Postgres verify (LIVEOPS-60)
  "pymssql>=2.3",
  "oracledb>=2.4",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "boto3>=1.34",
  "python-multipart>=0.0.9",
  "Pillow>=10.4",  # floor plan images: validation and pixel caps (ADR 0006)
  "pypdfium2>=4.30",  # floor plan PDFs: first page rendered to PNG
  "argon2-cffi>=23.1",  # password hashing, Argon2id (ADR 0008)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "moto[server]>=5.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "BLE"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]
"tests/**/test_auth*.py" = ["F811"]  # pytest fixtures imported from tests/auth_fixtures.py

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs real Postgres/Redis (LIVEOPS_TEST_PG_DSN)",
  "contract: shared connector contract kit",
]
